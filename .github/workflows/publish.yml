name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.repository == 'get-air/stremio-addon-client'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: corepack enable
      - run: npm install --global npm@11
      - run: pnpm install --frozen-lockfile
      - name: Verify release tag
        run: test "$GITHUB_REF_NAME" = "v$(node --print \"require('./package.json').version\")"
      - run: pnpm run ci
      - run: npm publish --access public --provenance
