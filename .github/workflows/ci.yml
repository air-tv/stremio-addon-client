name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - run: ./scripts/validate-release-version.sh v0.0.0
      - name: Test Linux-owned targets
        run: >-
          ./gradlew jvmTest jsNodeTest wasmJsNodeTest compileReleaseKotlinAndroid linuxX64Test
          --max-workers=2
      - name: Publish Linux-owned targets to an isolated Maven repository
        run: >-
          ./gradlew
          publishKotlinMultiplatformPublicationToHostTestRepository
          publishAndroidReleasePublicationToHostTestRepository
          publishJvmPublicationToHostTestRepository
          publishJsPublicationToHostTestRepository
          publishWasmJsPublicationToHostTestRepository
          publishLinuxX64PublicationToHostTestRepository
          -PVERSION_NAME=0.0.0
          -PTEMP_MAVEN_REPOSITORY="$RUNNER_TEMP/maven"
          --max-workers=2
      - run: find "$RUNNER_TEMP/maven/com/getair" -type f -name '*.pom' | grep -q .

  apple-host:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - run: ./scripts/validate-release-version.sh v0.0.0
      - name: Test Apple-owned targets
        run: >-
          ./gradlew macosX64Test compileKotlinMacosArm64 compileKotlinIosX64
          compileKotlinIosArm64 compileKotlinIosSimulatorArm64 --max-workers=2
      - name: Publish Apple targets to an isolated Maven repository
        run: >-
          ./gradlew
          publishMacosX64PublicationToHostTestRepository
          publishMacosArm64PublicationToHostTestRepository
          publishIosX64PublicationToHostTestRepository
          publishIosArm64PublicationToHostTestRepository
          publishIosSimulatorArm64PublicationToHostTestRepository
          -PVERSION_NAME=0.0.0
          -PTEMP_MAVEN_REPOSITORY="$RUNNER_TEMP/maven"
          --max-workers=2
      - run: find "$RUNNER_TEMP/maven/com/getair" -type f -name '*.pom' | grep -q .

  windows-host:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - run: ./scripts/validate-release-version.sh v0.0.0
        shell: bash
      - run: ./gradlew mingwX64Test --max-workers=2
        shell: bash
      - name: Publish Windows target to an isolated Maven repository
        shell: bash
        run: >-
          ./gradlew publishMingwX64PublicationToHostTestRepository
          -PVERSION_NAME=0.0.0
          -PTEMP_MAVEN_REPOSITORY="$RUNNER_TEMP/maven"
          --max-workers=2
      - run: find "$RUNNER_TEMP/maven/com/getair" -type f -name '*.pom' | grep -q .
        shell: bash
